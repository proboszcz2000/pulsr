<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notowanie głosowe (3 liczby)</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    text-align: center;
    margin: 0; padding: 0;
}
h2 { font-size: 2em; margin-top: 20px; }
p { font-size: 1.4em; }
button {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 20px 40px;
    font-size: 1.6em;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 20px;
}
button:active { background: #1558b0; }
#status {
    margin-top: 25px;
    font-size: 1.3em;
    font-weight: 600;
}
</style>
</head>
<body>

<h2>🎤 Notowanie głosowe</h2>
<p>Powiedz trzy liczby, np. "12, 45, 89".</p>

<button id="recordBtn">🎙️ Nagraj głos</button>

<div id="status"></div>

<script>
const btn = document.getElementById("recordBtn");
const statusEl = document.getElementById("status");
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbygRKibwZynUF1nwbT0otbzQ_ggRuE2PevYBJ3AhwV1H7zQemXtu0206fi-1ijtxTAeSg/exec";

    
btn.addEventListener("click", startRec);
btn.addEventListener("touchstart", (e) => { e.preventDefault(); startRec(); });

async function requestMic() {
    try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
        statusEl.textContent = "❌ Brak dostępu do mikrofonu.";
        throw new Error();
    }
}

async function startRec() {
    await requestMic();

    if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
        statusEl.textContent = "❌ Ta przeglądarka nie obsługuje rozpoznawania mowy.";
        return;
    }

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "pl-PL";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;  // <<< KLUCZOWE NA ANDROIDZIE

    statusEl.textContent = "🎧 Nasłuchiwanie... Mów teraz.";
    recognition.finished = false;

    // Start
    recognition.start();

    // 🔥 Najważniejsze: Android Chrome czasami NIE kończy sam → timeout 6s
    let timeout = setTimeout(() => {
        if (!recognition.finished) {
            recognition.stop();
            statusEl.textContent = "⌛ Czas minął. Spróbuj jeszcze raz.";
        }
    }, 6000);

    recognition.onresult = (event) => {
        recognition.finished = true;
        clearTimeout(timeout);

        const text = event.results[0][0].transcript;
        const nums = text.match(/\d+/g);

        if (!nums || nums.length < 3) {
            statusEl.textContent = "❌ Nie rozpoznano trzech liczb.";
            return;
        }

        const [n1, n2, n3] = nums;

        statusEl.innerHTML = `
            Rozpoznano: <b>${n1}</b>, <b>${n2}</b>, <b>${n3}</b><br>
            (tutaj możesz je wysłać do arkusza)
        `;

        recognition.stop();
    };

    recognition.onerror = (e) => {
        clearTimeout(timeout);
        statusEl.textContent = "❌ Błąd: " + e.error;
        recognition.stop();
    };

    // Gdy Android zakończy, ale bez wyniku
    recognition.onend = () => {
        if (!recognition.finished) {
            statusEl.textContent = "🎧 Nasłuchiwanie zakończone.";
        }
    };
}
</script>

</body>
</html>
